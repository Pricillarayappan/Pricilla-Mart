<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Pricilla Mart</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="brand-logo">
                <span class="brand-title">PRICILLA</span>
                <span class="brand-subtitle">MART</span>
            </a>

            <ul class="nav-links">
                <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
                <li><a href="products.html"><i class="fas fa-box"></i> Products</a></li>
                <li id="nav-auth-container"></li>
            </ul>
        </div>
    </header>

    <!-- 404 BODY -->
    <main class="main-content">
        <div style="text-align: center; padding: 6rem 1rem;">
            <div style="font-size: 6rem; font-weight: 900; color: var(--primary); line-height: 1;">404</div>
            <h2 style="font-size: 2rem; color: var(--secondary); margin-bottom: 1rem;">Oops! Page Not Found</h2>
            <p style="color: var(--text-muted); max-width: 500px; margin: 0 auto 2rem;">
                The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
            </p>
            <div style="display: flex; gap: 1rem; justify-content: center;">
                <a href="index.html" class="btn btn-primary"><i class="fas fa-home"></i> Back to Home</a>
                <a href="products.html" class="btn btn-outline"><i class="fas fa-box"></i> Browse Products</a>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="footer-bottom">
            &copy; 2026 Pricilla Mart - Multi Seller Online Shopping | Capstone Project
        </div>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
