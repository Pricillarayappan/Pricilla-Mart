<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Pricilla Mart</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <!-- ==================== NAVBAR ==================== -->
    <header class="navbar">

        <div class="nav-container">

            <!-- LOGO -->
            <a href="index.html" class="brand-logo">
                <span class="brand-title">PRICILLA</span>
                <span class="brand-subtitle">MART</span>
            </a>

            <!-- SEARCH -->
            <div class="nav-search">
                <i class="fas fa-search search-icon"></i>

                <input
                    type="text"
                    id="nav-search-input"
                    placeholder="Search catalog..."
                >
            </div>

            <!-- NAVIGATION -->
            <ul class="nav-links">

                <li>
                    <a href="index.html">
                        <i class="fas fa-home"></i>
                        Home
                    </a>
                </li>

                <li>
                    <a href="products.html">
                        <i class="fas fa-box"></i>
                        Products
                    </a>
                </li>

                <li>
                    <a href="register.html"
                       class="btn btn-sm btn-secondary">
                        Register
                    </a>
                </li>

            </ul>

        </div>

    </header>


    <!-- ==================== LOGIN FORM ==================== -->

    <main class="main-content">

        <div class="auth-wrapper">

            <div class="auth-card">

                <!-- HEADER -->
                <div class="auth-header">

                    <h2>
                        Welcome to Pricilla Mart
                    </h2>

                    <p>
                        Sign in to your Buyer, Seller, or Admin account
                    </p>

                </div>


                <!-- LOGIN FORM -->
                <form id="login-form">

                    <!-- EMAIL -->
                    <div class="form-group">

                        <label for="login-email">
                            <i class="fas fa-envelope"></i>
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="login-email"
                            class="form-control"
                            placeholder="name@example.com"
                            required
                        >

                    </div>


                    <!-- PASSWORD -->
                    <div class="form-group">

                        <label for="login-password">
                            <i class="fas fa-lock"></i>
                            Password
                        </label>

                        <input
                            type="password"
                            id="login-password"
                            class="form-control"
                            placeholder="Enter password"
                            required
                        >

                    </div>


                    <!-- SIGN IN -->
                    <button
                        type="submit"
                        class="btn btn-primary btn-block"
                        style="margin-top: 1rem;"
                    >

                        <i class="fas fa-sign-in-alt"></i>
                        Sign In

                    </button>

                </form>


                <!-- ==================== DEMO CREDENTIALS ==================== -->

                <div class="demo-credentials">

                    <div class="demo-credentials-title">

                        <i class="fas fa-magic"></i>

                        Quick Demo Logins (Viva & Evaluation):

                    </div>


                    <div class="demo-buttons">

                        <!-- ADMIN -->
                        <button
                            type="button"
                            class="btn btn-sm btn-outline"
                            onclick="Auth.fillDemoCredentials('admin')"
                            style="flex: 1; font-size: 0.75rem;"
                        >
                            Admin
                        </button>


                        <!-- SELLER -->
                        <button
                            type="button"
                            class="btn btn-sm btn-outline"
                            onclick="Auth.fillDemoCredentials('seller')"
                            style="flex: 1; font-size: 0.75rem;"
                        >
                            Seller
                        </button>


                        <!-- BUYER -->
                        <button
                            type="button"
                            class="btn btn-sm btn-outline"
                            onclick="Auth.fillDemoCredentials('buyer')"
                            style="flex: 1; font-size: 0.75rem;"
                        >
                            Buyer
                        </button>

                    </div>

                </div>


                <!-- REGISTER LINK -->
                <div
                    style="
                        text-align: center;
                        margin-top: 1.5rem;
                        font-size: 0.9rem;
                    "
                >

                    Don't have an account?

                    <a
                        href="register.html"
                        style="
                            font-weight: 700;
                            color: var(--primary);
                        "
                    >
                        Create Account
                    </a>

                </div>

            </div>

        </div>

    </main>


    <!-- ==================== FOOTER ==================== -->

    <footer class="footer">

        <div class="footer-bottom">

            &copy; 2026 Pricilla Mart -
            Multi Seller Online Shopping |
            Capstone Project

        </div>

    </footer>


    <!-- ==================== JAVASCRIPT ==================== -->

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/chatbot.js"></script>

</body>

</html>
