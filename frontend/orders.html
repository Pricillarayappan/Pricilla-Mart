<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - Pricilla Mart</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <div class="nav-container">
            <a href="/index.html" class="brand-logo">
                <span class="brand-title">PRICILLA</span>
                <span class="brand-subtitle">MART</span>
            </a>

            <div class="nav-search">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="nav-search-input" placeholder="Search catalog...">
            </div>

            <button class="mobile-menu-btn">
                <i class="fas fa-bars"></i>
            </button>

            <ul class="nav-links">
                <li><a href="/index.html"><i class="fas fa-home"></i> Home</a></li>
                <li><a href="/products.html"><i class="fas fa-box"></i> Products</a></li>
                <li>
                    <a href="/cart.html">
                        <i class="fas fa-shopping-cart"></i> Cart
                        <span class="badge cart-count-badge">0</span>
                    </a>
                </li>
                <li><a href="/orders.html" class="active"><i class="fas fa-receipt"></i> Orders</a></li>
                <li id="nav-auth-container"></li>
            </ul>
        </div>
    </header>

    <!-- ORDERS BODY -->
    <main class="main-content">
        <div style="margin-bottom: 2rem;">
            <h1 style="font-size: 1.8rem; margin: 0;">My Orders</h1>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Track real-time shipment status and leave verified product reviews</p>
        </div>

        <div id="orders-list-container">
            <!-- Loaded dynamically via orders.js -->
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="footer-bottom">
            &copy; 2026 Pricilla Mart - Multi Seller Online Shopping | Capstone Project
        </div>
    </footer>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/cart.js"></script>
    <script src="/js/orders.js"></script>
    <script src="/js/chatbot.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            Orders.loadOrderHistory();
        });
    </script>
</body>
</html>
