# ============================================================
# PRICILLA MART - SPRING BOOT CONFIGURATION
# College Capstone Project 2026
# ============================================================

server.port=${PORT:8080}
server.address=0.0.0.0

# Database Configuration
app.db.path=database/pricillamart.db
app.db.schema=database/schema.sql
app.db.seed=database/seed.sql

# JWT & Security Secret Key
app.jwt.secret=pricillamart_secret_key_college_capstone_2026

# Serve Frontend static files directly from ./frontend
spring.web.resources.static-locations=file:./frontend/,classpath:/static/

# File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.pricillamart=INFO
